# FinTrack — Netlify
# Site settings also use env vars: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: todas as rotas → index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
